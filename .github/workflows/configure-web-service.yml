name: Attach web service Secrets Manager credentials

# Re-wires the live dupli1-web task to read registration credentials from
# AWS Secrets Manager (same secret as dupli1-auth), without rebuilding the image.
#
# Do NOT put DUPLI1_WEB_SERVICE_* in GitHub Actions secrets — those drift from
# auth. Source of truth: dupli1/production/web-service-account
#
# Run from Actions → this workflow → Run workflow after a bad deploy stripped
# the secrets block, or after rotating the Secrets Manager password (also
# force-redeploy dupli1-auth so it re-seeds the DB password).

on:
  workflow_dispatch:

concurrency:
  group: configure-web-service-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: production
  ECS_SERVICE: dupli1-web
  CONTAINER_NAME: web
  WEB_SERVICE_SECRET_ID: dupli1/production/web-service-account

jobs:
  configure:
    name: Attach SM secrets on ECS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::845061289093:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Attach Secrets Manager credentials to web task
        run: bash scripts/configure-web-service-ecs.sh
