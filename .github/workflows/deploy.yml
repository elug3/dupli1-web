name: Deploy to Amazon ECS

on:
  push:
    branches: [master]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: web
  ECS_SERVICE: dupli1-web
  ECS_CLUSTER: production
  ECS_TASK_DEFINITION: .aws/task-definition.json
  # Must match live Terraform (ecs_frontends.tf): bridge EC2 service
  # family dupli1-web / container "web" — not Fargate awsvpc / web-container.
  CONTAINER_NAME: web
  # Shared with dupli1-auth (Terraform web_service_secret.tf). Do not inject
  # DUPLI1_WEB_SERVICE_* from GitHub Actions secrets — that drifts from auth.
  WEB_SERVICE_SECRET_ID: dupli1/production/web-service-account

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::845061289093:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Attach Secrets Manager web-service credentials
        run: |
          set -euo pipefail
          ARN="$(aws secretsmanager describe-secret \
            --secret-id "$WEB_SERVICE_SECRET_ID" \
            --query ARN \
            --output text)"
          jq \
            --arg email_from "${ARN}:DUPLI1_WEB_SERVICE_EMAIL::" \
            --arg password_from "${ARN}:DUPLI1_WEB_SERVICE_PASSWORD::" \
            '
              .containerDefinitions[0].environment |=
                map(select(
                  .name != "DUPLI1_WEB_SERVICE_EMAIL"
                  and .name != "DUPLI1_WEB_SERVICE_PASSWORD"
                  and .name != "DUPLI1_WEB_SERVICE_TOKEN"
                ))
              | .containerDefinitions[0].secrets = [
                  {name: "DUPLI1_WEB_SERVICE_EMAIL", valueFrom: $email_from},
                  {name: "DUPLI1_WEB_SERVICE_PASSWORD", valueFrom: $password_from}
                ]
            ' \
            "$ECS_TASK_DEFINITION" > /tmp/task-definition.json
          mv /tmp/task-definition.json "$ECS_TASK_DEFINITION"
          echo "Wired ECS secrets from $WEB_SERVICE_SECRET_ID"

      - name: Render Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
