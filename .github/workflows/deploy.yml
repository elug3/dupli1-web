name: Deploy to Amazon ECS

on:
  push:
    branches: [master]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: web
  ECS_SERVICE: dupli1-web
  ECS_CLUSTER: production
  ECS_TASK_DEFINITION: .aws/task-definition.json
  # Must match live Terraform (ecs_frontends.tf): bridge EC2 service
  # family dupli1-web / container "web" — not Fargate awsvpc / web-container.
  CONTAINER_NAME: web

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::845061289093:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build web service account env overrides
        id: web-env
        env:
          DUPLI1_WEB_SERVICE_EMAIL: ${{ secrets.DUPLI1_WEB_SERVICE_EMAIL }}
          DUPLI1_WEB_SERVICE_PASSWORD: ${{ secrets.DUPLI1_WEB_SERVICE_PASSWORD }}
          DUPLI1_WEB_SERVICE_TOKEN: ${{ secrets.DUPLI1_WEB_SERVICE_TOKEN }}
        run: |
          {
            echo 'vars<<EOF'
            if [[ -n "${DUPLI1_WEB_SERVICE_EMAIL}" && -n "${DUPLI1_WEB_SERVICE_PASSWORD}" ]]; then
              echo "DUPLI1_WEB_SERVICE_EMAIL=${DUPLI1_WEB_SERVICE_EMAIL}"
              echo "DUPLI1_WEB_SERVICE_PASSWORD=${DUPLI1_WEB_SERVICE_PASSWORD}"
            elif [[ -n "${DUPLI1_WEB_SERVICE_TOKEN}" ]]; then
              echo "DUPLI1_WEB_SERVICE_TOKEN=${DUPLI1_WEB_SERVICE_TOKEN}"
            else
              echo "::warning::Set secrets DUPLI1_WEB_SERVICE_EMAIL + DUPLI1_WEB_SERVICE_PASSWORD (preferred) or DUPLI1_WEB_SERVICE_TOKEN so registration works"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Render Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: ${{ steps.web-env.outputs.vars }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
